    <script>

        // corregge la base href per il deploy su github pages
        var base = document.createElement('base');
        base.href = location.hostname === 'localhost' ? '/' : '/lumenyx/';
        document.head.prepend(base);

        // Funzione per ottenere la versione del service worker
        window.GetSWVersion = async function () {

        const reg = await navigator.serviceWorker.getRegistration();

        return new Promise(resolve => {

            navigator.serviceWorker.addEventListener(
                'message',
                e => resolve(e.data),
                { once: true });
            
            reg.waiting ? "waiting:" + reg.waiting.postMessage("GET_VERSION") : reg.active.postMessage('GET_VERSION');;
        });
    }
    </script>
