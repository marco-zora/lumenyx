name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish

        run: dotnet publish BlazorPWA.csproj -c Release

 # --- MODIFICA AGGIUNTA QUI ---
      - name: Inserisci Timestamp nel Service Worker di Blazor
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H:%M:%S')
          echo "Nuovo timestamp Blazor PWA: $TIMESTAMP"
          
          # Applica la data in cima al file del service worker generato nella cartella di pubblicazione
          # Nota: Se il tuo file si chiama 'service-worker.published.js', sostituisci il nome qui sotto.
          sed -i "1i // Versione Build Automatica: $TIMESTAMP" ./bin/Release/net10.0/publish/wwwroot/service-worker.js
# -----------------------------

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./bin/Release/net10.0/publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4